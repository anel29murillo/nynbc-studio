<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nynbc Studio y Boutique</title>

  <style>
    :root {
      --rosa: #e1306c;
      --vino: #7a0b2e;
      --whatsapp: #25d366;
      --bg1: #fff0f5;
      --bg2: #f8cdda;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      color: var(--vino);
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: linear-gradient(135deg, #f8b6c8, #f3a6b8);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0;
      font-size: 1.9em;
      letter-spacing: 1px;
    }

    header p {
      margin-top: 8px;
      font-size: 1.05em;
    }

    /* TARJETA PRINCIPAL */
    .card {
      max-width: 520px;
      margin: 28px auto;
      background: #ffffff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.18);
    }

    /* CARRUSEL */
    .carousel {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .carousel-track img {
      width: 100%;
      height: auto;
      object-fit: cover;
      flex-shrink: 0;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.85);
      border: none;
      font-size: 26px;
      padding: 8px 14px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .prev { left: 12px; }
    .next { right: 12px; }

    /* CONTENIDO */
    .content {
      padding: 22px 20px 26px;
      text-align: center;
    }

    .content h2 {
      margin: 0 0 10px;
      font-size: 1.4em;
    }

    .content p {
      margin: 0;
      font-size: 1em;
      line-height: 1.5;
    }

    /* BOTONES FLOTANTES */
    .floating {
      position: fixed;
      bottom: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 999;
    }

    .floating a {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.35);
      transition: transform 0.2s ease;
      text-decoration: none;
    }

    .floating a:hover {
      transform: scale(1.1);
    }

    .instagram {
      background: var(--rosa);
    }

    .whatsapp {
      background: var(--whatsapp);
    }

    .floating svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }
  </style>
</head>

<body>

<header>
  <h1>Nynbc Studio y Boutique</h1>
  <p>Manos que hablan por ti</p>
</header>

<div class="card">
  <div class="carousel">
    <div class="carousel-track" id="track">

      <img src="imagen7.jpg.jpeg" alt="Diseño de uñas 7">
      <img src="imagen8.jpg.jpeg" alt="Diseño de uñas 8">
      <img src="imagen9.jpg.jpeg" alt="Diseño de uñas 9">
      <img src="imagen10.jpg.jpeg" alt="Diseño de uñas 10">

    <button class="carousel-btn prev" aria-label="Anterior">&#10094;</button>

<script>
  const track = document.getElementById("track");
  const slides = track.children;
  const next = document.querySelector(".next");
  const prev = document.querySelector(".prev");

  let index = 0;

  function moveSlide() {
    track.style.transform = `translateX(-${index * 100}%)`;
  }

  next.onclick = () => {
    index = (index + 1) % slides.length;
    moveSlide();
  };

  prev.onclick = () => {
    index = (index - 1 + slides.length) % slides.length;
    moveSlide();
  };

  // Carrusel automático cada 4 segundos
  let autoPlay = setInterval(() => {
    index = (index + 1) % slides.length;
    moveSlide();
  }, 4000);

  // Detener el autoPlay cuando el usuario hace clic manualmente
  const stopAutoPlay = () => clearInterval(autoPlay);
  next.addEventListener('click', stopAutoPlay);
  prev.addEventListener('click', stopAutoPlay);
</script>
